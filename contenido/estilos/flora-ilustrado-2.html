<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Caveat:wght@600;700&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}body{width:1080px;height:1350px;overflow:hidden;background:#FBF7F0;font-family:'Patrick Hand';color:#3D2B4F}
.s{width:1080px;height:1350px;padding:100px 80px 56px;display:flex;flex-direction:column;position:relative}
.mk{position:relative;display:inline-block;padding:0 14px;z-index:0}
.mk:before{content:"";position:absolute;left:-4px;right:-4px;top:22%;bottom:6%;background:#C9B6E4;border-radius:40% 55% 45% 60% / 60% 40% 65% 45%;transform:rotate(var(--r));z-index:-1;opacity:.9}
.kicker{font-family:Caveat;font-weight:700;font-size:52px;color:#8F79B3}
h1{font-weight:400;font-size:104px;line-height:1.02;margin-top:14px}
p{font-size:50px;line-height:1.3;margin-top:28px}
.note{background:#F1E8DA;padding:34px 38px 30px;font-size:46px;line-height:1.25;position:relative;box-shadow:0 10px 20px rgba(61,43,79,.10)}
.note:before{content:"";position:absolute;top:-18px;left:50%;width:150px;height:38px;margin-left:-75px;background:#C9B6E4;opacity:.85;transform:rotate(-3deg)}
.foot{margin-top:auto;display:flex;justify-content:center}.foot img{height:52px}
.avatar{border-radius:50%;background:#E9DFF5;display:grid;place-items:center;color:#8F79B3;font-size:30px;text-align:center;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}</style></head><body><div class="s"><div style="display:flex;align-items:center;gap:20px"><svg width="84" height="84" viewBox="0 0 100 100" style="overflow:visible"><g fill="none" stroke="#8F79B3" stroke-width="8"><ellipse cx="50" cy="28" rx="15" ry="22" transform="rotate(0 50 50)"/><ellipse cx="50" cy="28" rx="15" ry="22" transform="rotate(72 50 50)"/><ellipse cx="50" cy="28" rx="15" ry="22" transform="rotate(144 50 50)"/><ellipse cx="50" cy="28" rx="15" ry="22" transform="rotate(216 50 50)"/><ellipse cx="50" cy="28" rx="15" ry="22" transform="rotate(288 50 50)"/></g><g fill="#FBF7F0" stroke="none"><ellipse cx="50" cy="28" rx="15" ry="22" transform="rotate(0 50 50)"/><ellipse cx="50" cy="28" rx="15" ry="22" transform="rotate(72 50 50)"/><ellipse cx="50" cy="28" rx="15" ry="22" transform="rotate(144 50 50)"/><ellipse cx="50" cy="28" rx="15" ry="22" transform="rotate(216 50 50)"/><ellipse cx="50" cy="28" rx="15" ry="22" transform="rotate(288 50 50)"/></g><circle cx="50" cy="50" r="7" fill="none" stroke="#8F79B3" stroke-width="4"/></svg><div><div class="kicker" style="margin:0">paso 1</div><h1 style="margin:0;font-size:96px">Ordená tus <span class="mk" style="--r:-3deg">números</span></h1></div></div>
<div style="display:flex;gap:44px;margin-top:70px;align-items:flex-start">
<div style="flex:1.15;display:flex;flex-direction:column;gap:60px">
<div class="note" style="transform:rotate(-2deg)">Invertís en anuncios sin saber tu margen.</div>
<svg width="160" height="80" viewBox="0 0 160 80" style="margin-left:120px"><path d="M10 10 C 40 70, 110 70, 140 30" stroke="#8F79B3" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M118 28 L142 28 L138 52" stroke="#8F79B3" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
<div class="note" style="transform:rotate(1.5deg)">Vendés… pero no sabés si <b style="color:#8F79B3;font-weight:400">estás ganando.</b></div></div>
<div style="flex:.85;display:flex;flex-direction:column;align-items:center;gap:20px"><div class="avatar" style="width:330px;height:330px">avatar</div><div style="font-family:Caveat;font-size:44px;color:#8F79B3;text-align:center;transform:rotate(-3deg)">¿me suena conocido?</div></div></div>
<p style="text-align:center;margin-top:70px;font-size:56px">Con tu margen sabés <span class="mk" style="--r:2deg">cuánto podés invertir</span> sin perder plata.</p><div class="foot"><img src="flora-palabra-lila.png"></div></div></body></html>
