const SC=[['A',0,4],['B',4,7],['C',7,8.5],['D',8.5,14.5],['E',14.5,17],['F',17,19.01]];
const B_FR=90,C_FR=45, IMG=(p)=>'file:///tmp/claude-0/-home-user-florwilhjelm-github-io/5e4f6baa-32bb-5f35-af43-3504e6ba9e43/scratchpad/'+p;

const ease=k=>k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;

 if(cur!=='C')document.getElementById(cur).style.display='block';

   if(prev&&next&&sc(prev[1])[0]===cur&&sc(next[1])[0]===cur){const p=pos[prev[0]].at(-1),q=pos[next[0]][0];const k=ease((t-prev[2])/(next[1]-prev[2]));tip=[p[0]+(q[0]-p[0])*k,(p[1]+(q[1]-p[1])*k)-8-Math.sin(k*Math.PI)*70]}
   else if(prev&&sc(prev[1])[0]===cur){const p=pos[prev[0]].at(-1);tip=[p[0],p[1]-8]}
   else if(next&&sc(next[1])[0]===cur){const q=pos[next[0]][0];tip=[q[0],q[1]-8]}}
 // doll
 const DH=cur==='D'?300:(cur==='F'?440:360),SCL=DH/1218,HX=150*SCL,HY=660*SCL;doll.style.height=DH+'px';
 if(cur==='A'||cur==='D'||cur==='E'){doll.style.display='block';pen.style.display='block';

   let sx=1,rot=Math.sin(t*14)*2.2,bob=Math.abs(Math.sin(t*14))*-6;

 } else if(cur==='F'){doll.style.display='block';pen.style.display='none';const b=-Math.abs(Math.sin((t-17)*7))*45;doll.style.left=(540-DH*452/1218/2)+'px';doll.style.top=(960+b)+'px';doll.style.transform='rotate('+Math.sin(t*7)*5+'deg)'}
 else {doll.style.display='none';pen.style.display='none'}
 document.getElementById('f1').style.opacity=Math.min(1,Math.max(0,(t-17.05)/.3));document.getElementById('f2').style.opacity=Math.min(1,Math.max(0,(t-17.45)/.3));
 document.getElementById('logo').style.opacity=Math.min(1,Math.max(0,(t-17.8)/.3));
