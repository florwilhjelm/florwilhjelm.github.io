<div class="sc" id="A"><div class="t" style="top:300px;font-size:88px;line-height:1.12">Este local multiplicó por 4 su facturación.</div><div class="t" style="top:640px;font-size:66px;color:#8F79B3">Te cuento qué cambiamos 👇</div></div>

 <div class="t li" style="top:340px;right:auto" id="dl"></div></div>

 <svg class="t" style="top:430px" width="900" height="760" viewBox="0 0 900 760" id="chart"></svg></div>

<script>
const P='file:///tmp/claude-0/-home-user-florwilhjelm-github-io/5e4f6baa-32bb-5f35-af43-3504e6ba9e43/scratchpad/3d/c-';
function chars(el,txt){el.innerHTML=[...txt].map(c=>'<span class="ch">'+(c==' '?' ':c)+'</span>').join('')}
chars(b1,'Vendía bien en el local, pero online casi nada… y no podía escalar.');
chars(d0,'Lo que cambiamos:');
const L=['✓ Ordenamos la oferta','✓ Optimizamos la tienda','✓ Reestructuramos la comunicación','✓ Armamos una estrategia de contenido','✓ Anuncios con videos grabados en el local'];
dl.innerHTML=L.map((l,i)=>'<div id="l'+i+'"></div>').join('');L.forEach((l,i)=>chars(document.getElementById('l'+i),l));
// chart
const V=[5.8,6.5,7.4,7.9,19.2],M=['Ene','Feb','Mar','Abr','May'];let g='';
for(let k=0;k<=5;k++){const y=640-k*24*5;g+='<line x1="110" x2="880" y1="'+y+'" y2="'+y+'" stroke="#3D2B4F" stroke-opacity=".12"/><text x="95" y="'+(y+12)+'" text-anchor="end" font-size="34" fill="#3D2B4F" fill-opacity=".7">'+(k*5)+(k?'M':'')+'</text>'}
V.forEach((v,i)=>{const x=150+i*148;g+='<rect id="bar'+i+'" x="'+x+'" width="110" rx="16" y="640" height="0" fill="'+(i==4?'#8F79B3':'#C9B6E4')+'"/><text x="'+(x+55)+'" y="690" text-anchor="middle" font-size="36" fill="#3D2B4F">'+M[i]+'</text>'});
g+='<text id="lbl" x="'+(150+4*148+55)+'" y="0" text-anchor="middle" font-size="44" font-weight="700" fill="#8F79B3" opacity="0">19M</text>';
g+='<text x="500" y="745" text-anchor="middle" font-size="34" fill="#3D2B4F" fill-opacity=".7">Facturación por mes</text>';chart.innerHTML=g;
const SC=[['A',0,2],['B',2,5],['D',5.3,9.4],['E',9.4,12.4],['F',12.4,14.41]];
const cl=(x)=>Math.max(0,Math.min(1,x));const ease=k=>k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
function wr(el,t,a,b){const c=el.querySelectorAll('.ch'),n=c.length,v=Math.floor(cl((t-a)/(b-a))*n+1e-6);c.forEach((x,i)=>x.style.opacity=i<v?1:0)}
function pose(t){if(t<2)return['sonrie',700,70,'l'];if(t<4.6)return['triste',640,70,'l'];if(t<5.3)return['idea',690,70,'l'];if(t<9.4)return['espalda',640,0,'c'];if(t<12.4)return['sonrie',380,0,'c'];return['saluda',560,0,'c']}
window.render=t=>{
 let cur='F';for(const[n,s,e]of SC)if(t>=s&&t<e)cur=n;if(t>=5&&t<5.3)cur='D';
 document.querySelectorAll('.sc').forEach(e=>e.style.display='none');document.getElementById(cur).style.display='block';
 wr(b1,t,2.1,3.5);wr(d0,t,5.35,5.75);
 const ls=[[5.8,6.35],[6.4,6.95],[7.0,7.65],[7.7,8.35],[8.4,8.95]];L.forEach((l,i)=>wr(document.getElementById('l'+i),t,ls[i][0],ls[i][1]));
 document.getElementById('mkE').style.setProperty('--w',cl((t-9.7)/.4)*100+'%');
 V.forEach((v,i)=>{const k=ease(cl((t-10.0-i*0.18)/0.6));const h=v*24*k;const r=document.getElementById('bar'+i);r.setAttribute('y',640-h);r.setAttribute('height',h)});
 const lk=cl((t-11.3)/.3);lbl.setAttribute('y',640-19.2*24-16);lbl.setAttribute('opacity',lk);
 f1.style.opacity=cl((t-12.45)/.3);f2.style.opacity=cl((t-12.8)/.3);logo.style.opacity=cl((t-13.2)/.3);
 // doll
 const [n,h,ml,side]=pose(t);const src=P+n+'.png';if(doll.dataset.s!==src){doll.src=src;doll.dataset.s=src}
 doll.style.height=h+'px';const w=h*({sonrie:482/1237,triste:535/1105,idea:504/1198,espalda:464/1230,saluda:598/1339})[n];
 let x=side==='l'?ml:(side==='c'?540-w/2:1080-w-40);let top=1560-h;
 const seg=[0,2,4.6,5.3,9.4,12.4].filter(s=>s<=t).pop();const pin=cl((t-seg)/0.18);
 let bob=-Math.abs(Math.sin(t*5.5))*14,rot=Math.sin(t*3)*1.5,sy=1;
 if(n==='espalda'){bob=-Math.abs(Math.sin(t*2.2))*6;rot=Math.sin(t*1.6)*2}
 if(n==='saluda'){bob=-Math.abs(Math.sin(t*7))*30;rot=Math.sin(t*7)*4}
 if(n==='idea'){bob=-Math.sin(cl((t-4.6)/.3)*Math.PI)*70}
 if(n==='triste'){bob=0;rot=Math.sin(t*1.2)*1}
 sy=1-0.12*(1-pin)+0.0;doll.style.left=x+'px';doll.style.top=(top+bob)+'px';doll.style.transform='rotate('+rot+'deg) scaleY('+sy+') scaleX('+(2-sy)+')';doll.style.opacity=t>=5.0&&t<5.3?0:1;
 // flip 7.6-8.3
 if(t>=5.0&&t<5.3){flip.style.display='block';const k=ease(cl((t-5.0)/.3));flip.style.transform='rotateY('+(-180*k)+'deg)';flip.style.opacity=k>.5?0:1}else flip.style.display='none';
};
